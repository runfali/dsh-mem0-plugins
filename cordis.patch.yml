# dsh-mem0-plugins bundle patch
#
# Install (standard bundle plugin, no dsh source changes):
#   dsh plugin --profile web add /path/to/dsh-mem0-plugins
# Uninstall:
#   dsh plugin --profile web remove dsh-mem0-plugins
# Restart dsh after install/uninstall/config-file changes (settings-page edits
# apply immediately without a restart).
#
# This patch does one thing: attach this plugin's provider row at the profile
# layer, pointing at the local self-hosted Mem0 server (http://127.0.0.1:8888).
# `enabled` follows the schema default true — enabled out of the box (a local
# AUTH_DISABLED server works with zero config; fill in the API key in the
# settings page for remote servers). To disable memory, flip "Enable plugin"
# off in the settings card.
#
# These values are the settings composition base layer; values saved in the
# settings page live in the user layer and take precedence. To override the
# defaults, append to ~/.dsh/profiles/web/cordis.patch.yml:
#   - id: mem0
#     config:
#       host: http://mem0.internal:8888
#       apiKey: your-admin-api-key

- insert:
    - id: mem0
      name: dsh-mem0-plugins
      config:
        # `enabled` intentionally omitted: schema default is true (enabled on
        # install); users can turn it off explicitly in the settings page.
        host: http://127.0.0.1:8888
        apiKey: ''
        userId: dsh-user
        agentId: dsh
